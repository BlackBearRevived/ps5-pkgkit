[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-pkg"
dynamic = ["version"]
description = "Build, inspect and verify PS5 homebrew packages in pure Python."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Packaging",
]

[project.scripts]
ps5-pkg = "ps5_pkg.cli:main"

[project.urls]
Repository = "https://github.com/BlackBearRevived/ps5-pkg"
Issues = "https://github.com/BlackBearRevived/ps5-pkg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ps5_pkg.__version__"}
